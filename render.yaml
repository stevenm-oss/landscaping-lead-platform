services:
  - type: web
    name: texas-yard-quotes
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: texas-yard-quotes-db
          property: connectionString
      - key: SITE_NAME
        value: Texas Yard Quotes
      - key: HOUSE_NAME
        value: Clean & Clear Landscape Construction
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
databases:
  - name: texas-yard-quotes-db
    plan: basic-256mb
    databaseName: leads
    user: leads
